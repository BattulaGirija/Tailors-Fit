name: Screenshots

# Renders every app screen with Robolectric and commits the images to
# screenshots/ on the same branch. Pushes made with GITHUB_TOKEN do not trigger new runs.
on:
  push:
    paths:
      - "app/**"
      - "pattern-core/src/main/**"
      - "app/src/test/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screens (Robolectric)
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --tests '*ScreenshotTest*' 2>&1 | tee gradle.log

      - name: Collect screenshots and report
        if: always()
        run: |
          mkdir -p screenshots
          rm -f screenshots/*.png
          cp app/build/screenshots/*.png screenshots/ 2>/dev/null || true
          {
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            grep -E "^e: |error:|FAILED|Exception|BUILD" gradle.log | head -80 || true
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] && grep -A12 "<failure" "$f" | head -60
            done
          } > screenshots/report.txt 2>/dev/null || true

      - name: Commit screenshots
        if: always()
        run: |
          if [ -z "$(ls screenshots 2>/dev/null)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git diff --cached --quiet && exit 0
          git commit -m "Update app screenshots [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
